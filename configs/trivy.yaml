---
# see https://aquasecurity.github.io/trivy/v0.45/docs/references/configuration/config-file/
format: table
exit-code: 1
debug: false
severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL
ignorefile: ./configs/.trivyignore
scan:
  file-patterns:
  skip-dirs:
    - ./.github
  skip-files:
misconfiguration:
  include-non-failures: false
  terraform:
    vars:
    exclude-downloaded-modules: true
